services:
  catalog-db:
    image: postgres:13.5-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform-local-only
      POSTGRES_DB: platform
    ports: ["127.0.0.1:4612:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes: ["catalog-data:/var/lib/postgresql/data"]
volumes:
  catalog-data:
