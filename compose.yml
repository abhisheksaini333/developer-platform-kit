services:
  catalog-db:
    image: postgres:13.5-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform-local-only
      POSTGRES_DB: platform
    ports: ["127.0.0.1:4612:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes: ["catalog-data:/var/lib/postgresql/data"]
  keycloak:
    image: quay.io/keycloak/keycloak:17.0.1
    platform: linux/amd64
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin-local-only
      JAVA_OPTS_APPEND: -Xms64m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -XX:TieredStopAtLevel=1
    ports: ["127.0.0.1:4610:8080"]
    mem_limit: 768m
    cpus: 1.0
volumes:
  catalog-data:
