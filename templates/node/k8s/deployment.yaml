apiVersion: apps/v1
kind: Deployment
metadata:
  name: __NAME__
  labels: {app: __NAME__, platform-kit/owner: __OWNER__}
spec:
  replicas: 1
  selector:
    matchLabels: {app: __NAME__}
  template:
    metadata:
      labels: {app: __NAME__}
    spec:
      containers:
        - name: service
          image: __NAME__:1.0.0
          ports:
            - {name: http, containerPort: __PORT__}
---
apiVersion: v1
kind: Service
metadata:
  name: __NAME__
spec:
  selector: {app: __NAME__}
  ports:
    - {name: http, port: 80, targetPort: http}
